name: Python security and tests
on:
  push:
    branches: [python-reengineer]
  pull_request:
    paths:
      - 'src/ssh_ops/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-security.yml'

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python package and CI-only checks
        run: python -m pip install -e . ruff bandit pip-audit
      - name: Test all Python source files
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Ruff static checks
        run: ruff check --select E4,E7,E9,F src tests
      - name: Bandit security checks
        run: bandit -r -ll src/ssh_ops
      - name: Scan dependency CVEs (fail closed)
        run: pip-audit

  codeql-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
